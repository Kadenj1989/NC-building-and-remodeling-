media:
  input: content/uploads
  output: /content/uploads

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: content/posts
    filename: "{fields.slug}.md"

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: slug
        label: URL
        type: string
        required: true

      - name: date
        label: Date
        type: date
        required: true

      - name: featured_image
        label: Featured Image
        type: image
        required: false

      - name: video
        label: Video
        type: file
        required: false

      - name: attachment
        label: File / Document
        type: file
        required: false

      - name: body
        label: Blog Post
        type: rich-text
        required: true