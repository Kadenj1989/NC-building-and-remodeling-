media:
  input: img
  output: /img

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: content/posts
    filename: "{fields.slug}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: URL Slug
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: body
        label: Blog Post
        type: rich-text