media:
  - name: uploads
    label: Uploads
    input: content/uploads
    output: /content/uploads
    rename: safe

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: content/posts
    filename: "{fields.slug}.md"

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: slug
        label: URL
        type: string
        required: true

      - name: date
        label: Date
        type: date
        required: true

      - name: category
        label: Category
        type: select
        required: true
        description: Choose where this post appears on the Resources page.
        options:
          placeholder: Select a category
          values:
            - name: jobs
              label: Jobs/Projects
            - name: testimonials
              label: Video Testimonials
            - name: general
              label: General Information

      - name: featured_image
        label: Featured Image
        type: image
        required: false
        description: Optional cover photo used on the Resources list and home-page cards only. It does not decide where photos appear inside the article. Leave it blank to use the first photo from the post as the cover.
        options:
          media: uploads
          categories: [image]
          extensions: [jpg, jpeg, png, webp, gif]
          path: content/uploads
          rename: safe

      - name: youtube
        label: YouTube videos
        type: string
        list: true
        required: false
        description: Paste a YouTube link (watch, youtu.be, Shorts, or embed). Add another link for each extra video. Videos play on the post in the order you add them. Do not upload the video file.

      - name: attachment
        label: File / Document
        type: file
        required: false
        options:
          media: uploads

      - name: body
        label: Blog Post
        type: rich-text
        required: true
        description: Write the post here. Place a photo wherever you want it to appear, including between paragraphs. Add as many photos as you need. Each photo shows up on the website in that spot.
        options:
          format: markdown
          media: uploads
          categories: [image]
          extensions: [jpg, jpeg, png, webp, gif]
          path: content/uploads
          rename: safe